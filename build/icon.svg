<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Webdeck app icon. Rendered to build/icon.png by scripts/render-icon.cjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body on a 1024px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- A slide at 16:9... -->
  <g filter="url(#shadow)">
    <rect x="212" y="312" width="600" height="338" rx="26" fill="url(#slide)"/>
  </g>
  <rect x="268" y="376" width="250" height="34" rx="17" fill="#18181c"/>
  <rect x="268" y="436" width="360" height="20" rx="10" fill="#18181c" fill-opacity="0.28"/>
  <rect x="268" y="472" width="300" height="20" rx="10" fill="#18181c" fill-opacity="0.28"/>
  <!-- ...with the presenter's pointer marker on it. -->
  <circle cx="676" cy="566" r="30" fill="#0c0c0f" stroke="#ffffff" stroke-width="9"/>
  <!-- Stand. -->
  <rect x="496" y="662" width="32" height="96" rx="8" fill="#8e8e96"/>
  <rect x="400" y="744" width="224" height="30" rx="15" fill="#8e8e96"/>
</svg>
