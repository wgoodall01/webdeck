appId: com.allgoodhq.webdeck
productName: Webdeck
copyright: Copyright © 2026 William Goodall

directories:
  output: dist
  buildResources: build

# Only the built app and runtime deps ship; the renderer's prerender server
# bundle is a build artifact, not something the app loads.
files:
  - out/**
  - "!out/renderer/server/**"
  - "!out/smoke/**"
  - package.json

asar: true

fileAssociations:
  - ext: zip
    name: Claude Design export
    role: Viewer
    rank: Alternate
  - ext: pdf
    name: PDF slides
    role: Viewer
    rank: Alternate

mac:
  target:
    # Drag-to-install disk image, plus the bare .app zipped.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signed by default: Apple silicon refuses to run a modified,
  # unsigned app at all. Set CSC_LINK / CSC_KEY_PASSWORD (and override
  # identity) to sign with a Developer ID instead.
  identity: "-"
  # No version in file names, so releases/latest/download/<name> links stay stable.
  artifactName: ${productName}-mac-${arch}.${ext}

dmg:
  # The standard drag-to-Applications window.
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  # Windows: a portable .exe (runs without installing) and an .msi installer.
  # Both need Windows tooling (NSIS, WiX); build them on Windows or in CI.
  # `pnpm dist:win:zip` cross-builds a plain zip from anywhere.
  target:
    - target: portable
      arch: [x64]
    - target: msi
      arch: [x64]

portable:
  artifactName: ${productName}-win-${arch}-portable.${ext}

msi:
  artifactName: ${productName}-win-${arch}.${ext}
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
